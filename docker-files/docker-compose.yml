version: '3'
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USER_UID: ${UID}
    network_mode: host
    pid: host
    environment:
      DISPLAY: ${DISPLAY}
      XAUTHORITY: ${XAUTHORITY}
      QT_X11_NO_MITSHM: 1
    volumes:
      - ..:/workspaces/base:cached
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /dev/shm:/dev/shm
      - /dev/gpiomem:/dev/gpiomem/
      - /dev/mem:/dev/mem
      - /var/run/dbus:/var/run/dbus
    devices:
      - /dev/bms:/dev/bms
      # - /dev/mem:/dev/mem   #  Unsure if this is needed for ROS2 or only for GPIO 
    user: ${UID_GID}
